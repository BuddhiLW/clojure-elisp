name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    env:
      CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
      CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest

      # A hand-edited VERSION wins when its tag is free; otherwise the patch
      # advances to the first untagged A.B.X. build.clj owns this so VERSION,
      # the classpath resource and the README coordinates move together.
      - name: Resolve version (auto-bump patch when already tagged)
        id: version
        run: clojure -T:build bump-version

      - name: Commit version bump
        run: |
          if ! git diff --quiet -- VERSION resources/clojure-elisp/VERSION README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add VERSION resources/clojure-elisp/VERSION README.md
            git commit -m "release: v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Build uberjar
        run: clojure -T:build uber

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: target/clel-${{ steps.version.outputs.version }}.jar

      - name: Deploy to Clojars
        if: env.CLOJARS_USERNAME != ''
        run: clojure -T:build deploy
