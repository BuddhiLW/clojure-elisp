name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    env:
      CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
      CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest

      # Resolves in-workspace only — main is protected, so nothing is pushed
      # back. The committed VERSION is a floor; git tags are the ledger, and
      # each run picks the first untagged A.B.X above that floor. The jar and
      # the runtime .el header are stamped from the resolved value.
      - name: Resolve version (auto-bump patch when already tagged)
        id: version
        run: clojure -T:build bump-version

      - name: Build uberjar
        run: clojure -T:build uber

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: target/clel-${{ steps.version.outputs.version }}.jar

      - name: Deploy to Clojars
        if: env.CLOJARS_USERNAME != ''
        run: clojure -T:build deploy
