name: Tests

on:
  # Every pull request, whatever it targets. Restricting this to `main` meant a
  # PR stacked on another branch got no CI at all, silently: no run appears, and
  # an empty check list reads the same as a passing one.
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.cpcache
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run tests
        run: clojure -M:test

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.4'

      # The Clojure suite asserts on emitted strings, so a runtime defect is
      # invisible to it. These load the runtime into Emacs and call it.
      - name: Run Elisp tests
        run: make test-elisp

  # clel.el as MELPA reviews it, on every Emacs release it supports: checkdoc's
  # rules differ between releases, and melpazoid runs only the newest.
  lint-elisp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['28.2', '29.1', '30.1', '31.1']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Byte-compile, checkdoc and package-lint clel.el
        run: make lint-elisp
